<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIGISHOP</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; color: #fff; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }

  /* HEADER */
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 32px; background: #0a0a0a; position: sticky; top: 0; z-index: 100;
    border-bottom: 1px solid #1a1a1a;
  }
  .logo { color: #00ff88; font-size: 1.5rem; font-weight: 900; letter-spacing: 2px; }
  .admin-btn {
    background: none; border: none; cursor: pointer;
    color: #333; font-size: 1.1rem; transition: color 0.3s;
  }
  .admin-btn:hover { color: #00ff88; }

  /* CATÁLOGO */
  .catalog-section { padding: 40px 32px; }
  .catalog-header { display: flex; align-items: baseline; gap: 14px; margin-bottom: 32px; }
  .catalog-title { font-size: 1.4rem; font-weight: 900; letter-spacing: 3px; text-transform: uppercase; }
  .product-count { color: #00ff88; font-size: 0.85rem; font-weight: 700; letter-spacing: 2px; }

  .products-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
  }

  .product-card {
    background: #111; border-radius: 10px; overflow: hidden;
    cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
    border: 1px solid #1e1e1e;
  }
  .product-card:hover { transform: translateY(-4px); box-shadow: 0 8px 30px rgba(0,255,136,0.15); }

  .product-img-wrap { position: relative; aspect-ratio: 3/4; overflow: hidden; }
  .product-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
  .badge {
    position: absolute; top: 10px; left: 10px;
    background: #00ff88; color: #000; font-size: 0.65rem;
    font-weight: 800; letter-spacing: 1px; padding: 3px 8px; border-radius: 4px;
    text-transform: uppercase;
  }

  .product-info { padding: 12px; }
  .product-name { font-size: 0.9rem; font-weight: 700; margin-bottom: 4px; line-height: 1.3; }
  .product-desc { font-size: 0.75rem; color: #888; line-height: 1.4; margin-bottom: 12px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  .access-btn {
    display: block; width: 100%; padding: 10px;
    background: #00ff88; color: #000; font-weight: 800;
    font-size: 0.85rem; letter-spacing: 1px; text-align: center;
    border: none; border-radius: 6px; cursor: pointer;
    text-decoration: none; text-transform: uppercase; transition: background 0.2s;
  }
  .access-btn:hover { background: #00cc6a; }

  .empty-state {
    grid-column: 1/-1; text-align: center; padding: 80px 20px; color: #444;
  }
  .empty-state p { font-size: 1rem; margin-top: 10px; }

  /* FOOTER */
  footer {
    padding: 24px 32px; margin-top: 60px; border-top: 1px solid #1a1a1a;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 0.8rem; color: #555;
  }
  .footer-logo { color: #00ff88; font-weight: 900; letter-spacing: 2px; }
  .footer-tag { color: #00ff88; }

  /* MODAL ADMIN */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.85); z-index: 1000;
    justify-content: center; align-items: center; padding: 20px;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: #111; border: 1px solid #222; border-radius: 14px;
    width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto;
  }
  .modal-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 20px 24px; border-bottom: 1px solid #1e1e1e;
  }
  .modal-header h2 { font-size: 1rem; font-weight: 800; letter-spacing: 1px; }
  .close-btn { background: none; border: none; color: #888; font-size: 1.3rem; cursor: pointer; }
  .close-btn:hover { color: #fff; }

  .modal-body { padding: 24px; }

  /* LOGIN */
  .login-form { display: flex; flex-direction: column; gap: 14px; }
  .login-form input {
    background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px;
    padding: 12px 14px; color: #fff; font-size: 0.9rem; outline: none;
  }
  .login-form input:focus { border-color: #00ff88; }
  .login-form button {
    background: #00ff88; color: #000; font-weight: 800;
    padding: 12px; border: none; border-radius: 8px; cursor: pointer;
    font-size: 0.9rem; letter-spacing: 1px;
  }
  .login-form button:hover { background: #00cc6a; }
  .login-error { color: #ff4444; font-size: 0.8rem; text-align: center; display: none; }

  /* PAINEL ADMIN */
  .admin-panel { display: none; flex-direction: column; gap: 20px; }
  .admin-panel.active { display: flex; }

  .panel-tabs { display: flex; gap: 8px; margin-bottom: 4px; }
  .tab-btn {
    flex: 1; padding: 9px; background: #1a1a1a; border: 1px solid #2a2a2a;
    color: #888; border-radius: 8px; cursor: pointer; font-size: 0.8rem;
    font-weight: 700; letter-spacing: 1px; transition: all 0.2s;
  }
  .tab-btn.active { background: #00ff88; color: #000; border-color: #00ff88; }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* FORM PRODUTO */
  .product-form { display: flex; flex-direction: column; gap: 12px; }
  .product-form label { font-size: 0.75rem; color: #888; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 2px; display: block; }
  .product-form input, .product-form textarea, .product-form select {
    width: 100%; background: #1a1a1a; border: 1px solid #2a2a2a;
    border-radius: 8px; padding: 10px 12px; color: #fff; font-size: 0.85rem;
    outline: none; font-family: inherit;
  }
  .product-form input:focus, .product-form textarea:focus { border-color: #00ff88; }
  .product-form textarea { resize: vertical; min-height: 80px; }
  .img-preview { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 8px; display: none; margin-top: 6px; }
  .img-preview.show { display: block; }

  .form-actions { display: flex; gap: 10px; margin-top: 4px; }
  .btn-save {
    flex: 1; background: #00ff88; color: #000; font-weight: 800;
    padding: 11px; border: none; border-radius: 8px; cursor: pointer;
    font-size: 0.85rem; letter-spacing: 1px;
  }
  .btn-save:hover { background: #00cc6a; }
  .btn-cancel {
    padding: 11px 16px; background: #1a1a1a; color: #888;
    border: 1px solid #2a2a2a; border-radius: 8px; cursor: pointer; font-size: 0.85rem;
  }
  .btn-cancel:hover { color: #fff; }

  /* LISTA DE PRODUTOS NO PAINEL */
  .admin-product-list { display: flex; flex-direction: column; gap: 10px; }
  .admin-product-item {
    display: flex; align-items: center; gap: 12px;
    background: #1a1a1a; border-radius: 8px; padding: 10px 12px;
    border: 1px solid #222;
  }
  .admin-product-item img { width: 44px; height: 58px; object-fit: cover; border-radius: 6px; background: #2a2a2a; }
  .admin-item-info { flex: 1; }
  .admin-item-name { font-size: 0.85rem; font-weight: 700; margin-bottom: 2px; }
  .admin-item-badge { font-size: 0.7rem; color: #00ff88; }
  .admin-item-actions { display: flex; gap: 6px; }
  .btn-edit, .btn-delete {
    padding: 6px 10px; border-radius: 6px; border: none; cursor: pointer;
    font-size: 0.75rem; font-weight: 700;
  }
  .btn-edit { background: #1e3a2a; color: #00ff88; }
  .btn-edit:hover { background: #00ff88; color: #000; }
  .btn-delete { background: #3a1e1e; color: #ff6666; }
  .btn-delete:hover { background: #ff4444; color: #fff; }

  .status-msg { font-size: 0.8rem; text-align: center; padding: 8px; border-radius: 6px; display: none; }
  .status-msg.success { background: #0a2a1a; color: #00ff88; display: block; }
  .status-msg.error { background: #2a0a0a; color: #ff6666; display: block; }

  .loading { text-align: center; padding: 40px; color: #444; font-size: 0.9rem; }
</style>
</head>
<body>

<header>
  <div class="logo">DIGISHOP</div>
  <button class="admin-btn" onclick="openAdmin()" title="Painel Admin">⚙</button>
</header>

<main>
  <section class="catalog-section">
    <div class="catalog-header">
      <h2 class="catalog-title">Catálogo</h2>
      <span class="product-count" id="product-count">0 PRODUTOS</span>
    </div>
    <div class="products-grid" id="products-grid">
      <div class="loading">Carregando produtos...</div>
    </div>
  </section>
</main>

<footer>
  <span class="footer-logo">DIGISHOP</span>
  <span>© 2025 · Todos os direitos reservados</span>
  <span class="footer-tag">Produtos Digitais</span>
</footer>

<!-- MODAL ADMIN -->
<div class="modal-overlay" id="modal-overlay" onclick="handleOverlayClick(event)">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-title">🔐 ACESSO ADMIN</h2>
      <button class="close-btn" onclick="closeAdmin()">✕</button>
    </div>
    <div class="modal-body">

      <!-- LOGIN -->
      <div id="login-section">
        <div class="login-form">
          <div>
            <label style="font-size:0.75rem;color:#888;letter-spacing:1px;text-transform:uppercase;display:block;margin-bottom:6px;">Senha</label>
            <input type="password" id="admin-password" placeholder="Digite a senha..." onkeydown="if(event.key==='Enter')doLogin()">
          </div>
          <p class="login-error" id="login-error">Senha incorreta!</p>
          <button onclick="doLogin()">ENTRAR</button>
        </div>
      </div>

      <!-- PAINEL -->
      <div class="admin-panel" id="admin-panel">
        <div class="panel-tabs">
          <button class="tab-btn active" onclick="switchTab('add')">+ ADICIONAR</button>
          <button class="tab-btn" onclick="switchTab('list')">📋 PRODUTOS</button>
        </div>

        <!-- ABA ADICIONAR/EDITAR -->
        <div class="tab-content active" id="tab-add">
          <div class="product-form">
            <input type="hidden" id="edit-id">
            <div>
              <label>Nome do Produto</label>
              <input type="text" id="prod-name" placeholder="Ex: Pack de Templates Canva">
            </div>
            <div>
              <label>Descrição</label>
              <textarea id="prod-desc" placeholder="Descreva o produto..."></textarea>
            </div>
            <div>
              <label>URL da Imagem</label>
              <input type="url" id="prod-img" placeholder="https://i.ibb.co/..." oninput="previewImg()">
              <img class="img-preview" id="img-preview" alt="preview">
            </div>
            <div>
              <label>Link de Acesso</label>
              <input type="url" id="prod-link" placeholder="https://...">
            </div>
            <div>
              <label>Badge (ex: EXCLUSIVO)</label>
              <input type="text" id="prod-badge" placeholder="EXCLUSIVO" value="EXCLUSIVO">
            </div>
            <div class="form-actions">
              <button class="btn-cancel" onclick="resetForm()">Limpar</button>
              <button class="btn-save" onclick="saveProduct()">SALVAR</button>
            </div>
            <p class="status-msg" id="status-msg"></p>
          </div>
        </div>

        <!-- ABA LISTA -->
        <div class="tab-content" id="tab-list">
          <div class="admin-product-list" id="admin-list">
            <div class="loading">Carregando...</div>
          </div>
        </div>

        <button onclick="doLogout()" style="background:none;border:1px solid #2a2a2a;color:#555;padding:8px;border-radius:8px;cursor:pointer;font-size:0.8rem;">Sair</button>
      </div>

    </div>
  </div>
</div>

<!-- FIREBASE SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, push, set, remove, onValue, update }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSy8hEHJOis-ej56fNtwcZhIS75kQLlbj-OA",
    authDomain: "digishop-9e538.firebaseapp.com",
    databaseURL: "https://digishop-9e538-default-rtdb.firebaseio.com",
    projectId: "digishop-9e538",
    storageBucket: "digishop-9e538.firebasestorage.app",
    messagingSenderId: "122052992541",
    appId: "1:122052992541:web:12541a8fabd9249d6fb0f4"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const productsRef = ref(db, 'produtos');

  // ---- RENDER LOJA ----
  function renderCatalog(products) {
    const grid = document.getElementById('products-grid');
    const count = document.getElementById('product-count');
    const entries = Object.entries(products || {});
    count.textContent = entries.length + ' PRODUTO' + (entries.length !== 1 ? 'S' : '');

    if (entries.length === 0) {
      grid.innerHTML = '<div class="empty-state"><span style="font-size:2rem">📦</span><p>Nenhum produto cadastrado ainda.</p></div>';
      return;
    }

    grid.innerHTML = entries.map(([id, p]) => `
      <div class="product-card">
        <div class="product-img-wrap">
          ${p.imagem ? `<img src="${p.imagem}" alt="${p.nome}" onerror="this.style.display='none'">` : '<div style="width:100%;height:100%;background:#1a1a1a"></div>'}
          ${p.badge ? `<span class="badge">${p.badge}</span>` : ''}
        </div>
        <div class="product-info">
          <div class="product-name">${p.nome}</div>
          <div class="product-desc">${p.descricao || ''}</div>
          <a class="access-btn" href="${p.link || '#'}" target="_blank" rel="noopener">ACESSAR</a>
        </div>
      </div>
    `).join('');
  }

  onValue(productsRef, (snapshot) => {
    renderCatalog(snapshot.val());
    renderAdminList(snapshot.val());
  });

  // ---- SALVAR PRODUTO ----
  window.saveProduct = function() {
    const id = document.getElementById('edit-id').value;
    const nome = document.getElementById('prod-name').value.trim();
    const descricao = document.getElementById('prod-desc').value.trim();
    const imagem = document.getElementById('prod-img').value.trim();
    const link = document.getElementById('prod-link').value.trim();
    const badge = document.getElementById('prod-badge').value.trim();

    if (!nome || !link) {
      showStatus('Preencha pelo menos o nome e o link!', 'error');
      return;
    }

    const data = { nome, descricao, imagem, link, badge };

    if (id) {
      update(ref(db, 'produtos/' + id), data)
        .then(() => { showStatus('Produto atualizado! ✓', 'success'); resetForm(); })
        .catch(() => showStatus('Erro ao atualizar.', 'error'));
    } else {
      push(productsRef, data)
        .then(() => { showStatus('Produto adicionado! ✓', 'success'); resetForm(); })
        .catch(() => showStatus('Erro ao salvar.', 'error'));
    }
  };

  // ---- DELETAR ----
  window.deleteProduct = function(id) {
    if (!confirm('Remover este produto?')) return;
    remove(ref(db, 'produtos/' + id));
  };

  // ---- EDITAR ----
  window.editProduct = function(id, p) {
    document.getElementById('edit-id').value = id;
    document.getElementById('prod-name').value = p.nome || '';
    document.getElementById('prod-desc').value = p.descricao || '';
    document.getElementById('prod-img').value = p.imagem || '';
    document.getElementById('prod-link').value = p.link || '';
    document.getElementById('prod-badge').value = p.badge || 'EXCLUSIVO';
    previewImg();
    switchTab('add');
    document.getElementById('modal-title').textContent = '✏️ EDITAR PRODUTO';
  };

  // ---- LISTA ADMIN ----
  function renderAdminList(products) {
    const list = document.getElementById('admin-list');
    if (!list) return;
    const entries = Object.entries(products || {});
    if (entries.length === 0) {
      list.innerHTML = '<p style="color:#555;text-align:center;padding:20px;">Nenhum produto cadastrado.</p>';
      return;
    }
    list.innerHTML = entries.map(([id, p]) => `
      <div class="admin-product-item">
        <img src="${p.imagem || ''}" alt="" onerror="this.style.opacity='0'">
        <div class="admin-item-info">
          <div class="admin-item-name">${p.nome}</div>
          <div class="admin-item-badge">${p.badge || ''}</div>
        </div>
        <div class="admin-item-actions">
          <button class="btn-edit" onclick='editProduct("${id}", ${JSON.stringify(p)})'>Editar</button>
          <button class="btn-delete" onclick='deleteProduct("${id}")'>Excluir</button>
        </div>
      </div>
    `).join('');
  }
</script>

<script>
  const ADMIN_PASS = "admin123"; // TROQUE ESSA SENHA!
  let loggedIn = false;

  function openAdmin() {
    document.getElementById('modal-overlay').classList.add('active');
    if (loggedIn) showPanel();
  }

  function closeAdmin() {
    document.getElementById('modal-overlay').classList.remove('active');
  }

  function handleOverlayClick(e) {
    if (e.target === document.getElementById('modal-overlay')) closeAdmin();
  }

  function doLogin() {
    const pass = document.getElementById('admin-password').value;
    if (pass === ADMIN_PASS) {
      loggedIn = true;
      showPanel();
    } else {
      document.getElementById('login-error').style.display = 'block';
    }
  }

  function doLogout() {
    loggedIn = false;
    document.getElementById('admin-panel').classList.remove('active');
    document.getElementById('login-section').style.display = 'block';
    document.getElementById('admin-password').value = '';
    document.getElementById('modal-title').textContent = '🔐 ACESSO ADMIN';
    closeAdmin();
  }

  function showPanel() {
    document.getElementById('login-section').style.display = 'none';
    document.getElementById('admin-panel').classList.add('active');
    document.getElementById('modal-title').textContent = '⚙ PAINEL ADMIN';
  }

  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', (tab==='add'&&i===0)||(tab==='list'&&i===1)));
    document.getElementById('tab-add').classList.toggle('active', tab==='add');
    document.getElementById('tab-list').classList.toggle('active', tab==='list');
    if (tab === 'add') {
      document.getElementById('modal-title').textContent = document.getElementById('edit-id').value ? '✏️ EDITAR PRODUTO' : '⚙ PAINEL ADMIN';
    }
  }

  function resetForm() {
    document.getElementById('edit-id').value = '';
    document.getElementById('prod-name').value = '';
    document.getElementById('prod-desc').value = '';
    document.getElementById('prod-img').value = '';
    document.getElementById('prod-link').value = '';
    document.getElementById('prod-badge').value = 'EXCLUSIVO';
    document.getElementById('img-preview').classList.remove('show');
    document.getElementById('modal-title').textContent = '⚙ PAINEL ADMIN';
    hideStatus();
  }

  function previewImg() {
    const url = document.getElementById('prod-img').value.trim();
    const preview = document.getElementById('img-preview');
    if (url) { preview.src = url; preview.classList.add('show'); }
    else { preview.classList.remove('show'); }
  }

  function showStatus(msg, type) {
    const el = document.getElementById('status-msg');
    el.textContent = msg;
    el.className = 'status-msg ' + type;
    setTimeout(hideStatus, 3000);
  }

  function hideStatus() {
    const el = document.getElementById('status-msg');
    el.className = 'status-msg';
  }
</script>
</body>
</html>
